<script>
(function(){
  const P=JSON.parse(document.getElementById('payload').textContent);
  const KEY='panel-clave';
  const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const store={get(){try{return localStorage.getItem(KEY)}catch(e){return null}},
    set(v){try{v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY)}catch(e){}}};
  async function open(pw){
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b(P.salt),iterations:P.iter},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
    const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.iv)},key,b(P.data)));
    document.open();document.write(html);document.close();
  }
  const f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),
    go=document.getElementById('go'),keep=document.getElementById('keep');
  f.addEventListener('submit',async e=>{
    e.preventDefault();go.disabled=true;err.textContent='';
    try{const v=pw.value;await open(v);store.set(keep.checked?v:null);}
    catch(x){err.textContent='Contraseña incorrecta.';go.disabled=false;pw.select();}
  });
  const saved=store.get();
  if(saved){go.disabled=true;open(saved).catch(()=>{store.set(null);go.disabled=false;});}
})();
</script>
